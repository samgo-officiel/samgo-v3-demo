name: SAMGO - Construire Android TEST (APK de diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'assets/**'
      - 'aide.html'
      - 'donnees-test.html'
      - 'hors-ligne.html'
      - '.github/workflows/android-test.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'assets/**'
      - 'tests/native-navigation.test.cjs'
      - '.github/workflows/android-test.yml'

permissions:
  contents: read

# Une mise a jour de la PR annule son ancien build, jamais celui de main.
concurrency:
  group: samgo-android-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Cloner le code SAMGO
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21 pour Capacitor 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier le SDK Android du runner GitHub
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Installer les dependances Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Preparer les pages locales de SAMGO
        working-directory: mobile
        run: npm run build:web
      - name: Generer le projet Android (aucune publication)
        working-directory: mobile
        run: npx cap add android
      - name: Ajouter permissions GPS pendant utilisation uniquement
        working-directory: mobile
        run: node scripts/configure-native.cjs
      - name: Synchroniser le bundle
        working-directory: mobile
        run: npx cap sync android
      - name: Compiler APK DEBUG sans signature de distribution
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verifier la presence de l'APK de test
        run: test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Lire le manifeste de l'APK compilée (permissions et identifiant)
        run: node scripts/verify-android-debug.cjs mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Deposer APK de test en artefact GitHub (7 jours)
        uses: actions/upload-artifact@v4
        with:
          name: samgo-android-test-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  # Test du MÊME APK que celui compilé par le job ci-dessus, sans run-id figé.
  # Émulateur uniquement, pas de compte, GPS, paiement ou trajet réel.
  smoke-android:
    needs: build-android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Charger scripts de test SAMGO
        uses: actions/checkout@v4
      - name: Récupérer l'APK DEBUG de cette exécution
        uses: actions/download-artifact@v4
        with:
          name: samgo-android-test-debug
          path: mobile/android/app/build/outputs/apk/debug
      - name: Vérifier le fichier APK de la PR
        run: test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Démarrer et photographier l'accueil Android TEST
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh
      - name: Conserver la capture Android anonyme 7 jours
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samgo-android-accueil-emulateur
          path: mobile/test-output/samgo-android-emulateur.png
          retention-days: 7
          if-no-files-found: warn
