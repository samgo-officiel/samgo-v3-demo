name: SAMGO - Demarrer iPhone TEST sur simulateur

on:
  workflow_dispatch:
  # Essai de lancement distinct : ne fait jamais échouer une compilation valide
  # simplement parce que CoreSimulator ne démarre pas sur le runner.
  workflow_run:
    workflows:
      - "SAMGO - Compiler iPhone TEST (simulateur uniquement)"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  smoke-iphone:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - name: Recuperer depot SAMGO
        uses: actions/checkout@v4
      - name: Selectionner le dernier artefact iOS TEST non expire
        if: github.event_name == 'workflow_dispatch'
        id: ios_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=samgo-ios-test-simulateur&per_page=50" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.id != null)][0].workflow_run.id // empty')"
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Aucun build iOS TEST valide (artefacts conserves 7 jours)." >&2
            echo "Lancer d'abord le workflow 'Compiler iPhone TEST'." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Recuperer le programme iOS TEST selectionne
        uses: actions/download-artifact@v4
        with:
          name: samgo-ios-test-simulateur
          repository: samgo-officiel/samgo-v3-demo
          # Les déclenchements automatiques doivent utiliser exactement le build
          # qui a lancé l'événement, jamais un ancien ZIP du même nom.
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || steps.ios_artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ios-artifact
      - name: Extraire l'application de simulateur
        run: |
          test -s ios-artifact/samgo-ios-simulator-test.zip
          mkdir -p ios-unpacked
          ditto -x -k ios-artifact/samgo-ios-simulator-test.zip ios-unpacked
          find ios-unpacked -name 'App.app' -type d
      - name: Demarrer simulateur et ouvrir SAMGO TEST
        timeout-minutes: 12
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j | node -e '
          let raw="";process.stdin.on("data",x=>raw+=x);
          process.stdin.on("end",()=>{
            const data=JSON.parse(raw);
            for(const devices of Object.values(data.devices||{})){
              const phone=devices.find(d=>d.isAvailable&&d.name.startsWith("iPhone"));
              if(phone){process.stdout.write(phone.udid);return;}
            }
            process.exit(1);
          });')"
          test -n "$DEVICE"
          echo "Simulateur choisi : $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="$(find ios-unpacked -name App.app -type d | head -n 1)"
          test -d "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.samgo.prototype
          sleep 8
          mkdir -p screenshots
          xcrun simctl io "$DEVICE" screenshot screenshots/samgo-iphone-test.png
          test -s screenshots/samgo-iphone-test.png
      - name: Conserver capture de l'accueil iPhone TEST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samgo-iphone-simulateur-capture
          path: screenshots/samgo-iphone-test.png
          retention-days: 7
          if-no-files-found: warn
