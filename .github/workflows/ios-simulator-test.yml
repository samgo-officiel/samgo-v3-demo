name: SAMGO - Compiler iPhone TEST (simulateur uniquement)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'assets/**'
      - 'aide.html'
      - 'donnees-test.html'
      - 'hors-ligne.html'
      - '.github/workflows/ios-simulator-test.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'assets/**'
      - 'tests/native-navigation.test.cjs'
      - '.github/workflows/ios-simulator-test.yml'

permissions:
  contents: read

# Une nouvelle modification de brouillon remplace l'ancienne compilation PR.
# Les builds de main restent dans un groupe distinct.
concurrency:
  group: samgo-ios-simulator-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-ios-simulator:
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - name: Recuperer le depot SAMGO
        uses: actions/checkout@v4
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier Xcode du simulateur
        run: xcodebuild -version
      - name: Installer Capacitor (sans abonnement)
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Preparer les pages de l'application
        working-directory: mobile
        run: npm run build:web
      - name: Generer le projet iOS (sans signature)
        working-directory: mobile
        run: npx cap add ios
      - name: Explication GPS pendant utilisation
        working-directory: mobile
        run: node scripts/configure-native.cjs
      - name: Synchroniser l'application
        working-directory: mobile
        run: npx cap sync ios
      - name: Appliquer logo SAMGO sur application iPhone TEST
        working-directory: mobile
        run: node scripts/configure-ios-icons.cjs
      - name: Compiler SAMGO TEST pour simulateur (pas d'IPA ni distribution)
        working-directory: mobile
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
              -configuration Debug -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App \
              -configuration Debug -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
          fi
      - name: Verifier bundle iPhone de test
        run: test -d mobile/ios-build/Build/Products/Debug-iphonesimulator/App.app
      - name: Démarrer SAMGO TEST sur un simulateur iPhone sans compte
        timeout-minutes: 8
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j | node -e '
          let raw="";process.stdin.on("data",x=>raw+=x);
          process.stdin.on("end",()=>{
            const data=JSON.parse(raw);
            for(const devices of Object.values(data.devices||{})){
              const phone=devices.find(d=>d.isAvailable&&d.name.startsWith("iPhone"));
              if(phone){process.stdout.write(phone.udid);return;}
            }
            process.exit(1);
          });')"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" mobile/ios-build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.samgo.prototype
          sleep 6
          mkdir -p mobile/screenshots
          xcrun simctl io "$DEVICE" screenshot mobile/screenshots/iphone-accueil-test.png
          test -s mobile/screenshots/iphone-accueil-test.png
      - name: Garder capture iPhone anonyme de la PR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samgo-iphone-smoke-test
          path: mobile/screenshots/iphone-accueil-test.png
          retention-days: 7
          if-no-files-found: warn
      - name: Archiver pour diagnostic simulateur
        run: |
          ditto -c -k --keepParent mobile/ios-build/Build/Products/Debug-iphonesimulator/App.app mobile/samgo-ios-simulator-test.zip
      - name: Conserver le build simulateur 7 jours
        uses: actions/upload-artifact@v4
        with:
          name: samgo-ios-test-simulateur
          path: mobile/samgo-ios-simulator-test.zip
          retention-days: 7
          if-no-files-found: error
