name: SAMGO - Tester demarrage Android sur emulateur

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-test.yml'

permissions:
  contents: read

jobs:
  smoke-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Recuperer SAMGO
        uses: actions/checkout@v4
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verifier SDK Android
        run: test -d "$ANDROID_HOME"
      - name: Installer Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Construire pages TEST
        working-directory: mobile
        run: npm run build:web
      - name: Generer Android
        working-directory: mobile
        run: npx cap add android
      - name: Ajouter permissions et logo
        working-directory: mobile
        run: node scripts/configure-native.cjs
      - name: Synchroniser projet Android
        working-directory: mobile
        run: npx cap sync android
      - name: Generer APK de test
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Installer et ouvrir SAMGO sur emulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            echo "Android started: $(adb shell getprop sys.boot_completed)"
            echo "Waiting for Android package manager..."
            for try in 1 2 3 4 5 6; do
              if adb shell pm list packages >/dev/null 2>&1; then break; fi
              sleep 8
            done
            echo "Installing SAMGO TEST without streaming (emulator compatibility)..."
            installed=0
            for try in 1 2 3 4; do
              if adb install --no-streaming -r mobile/android/app/build/outputs/apk/debug/app-debug.apk; then
                installed=1
                break
              fi
              sleep 10
              adb wait-for-device
            done
            test "$installed" -eq 1
            adb shell am start -W -n com.samgo.prototype/.MainActivity
            sleep 12
            adb shell pidof com.samgo.prototype
            mkdir -p mobile/test-output
            adb shell screencap -p /sdcard/samgo-test.png
            adb pull /sdcard/samgo-test.png mobile/test-output/samgo-android-emulateur.png
            test -s mobile/test-output/samgo-android-emulateur.png
      - name: Conserver capture de l'ecran d'accueil du simulateur
        uses: actions/upload-artifact@v4
        with:
          name: samgo-android-test-capture-ecran
          path: mobile/test-output/samgo-android-emulateur.png
          retention-days: 7
          if-no-files-found: error
