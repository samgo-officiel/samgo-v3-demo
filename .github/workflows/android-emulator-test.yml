name: SAMGO - Tester demarrage Android sur emulateur

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-test.yml'

permissions:
  contents: read

jobs:
  smoke-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Recuperer SAMGO
        uses: actions/checkout@v4
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verifier SDK Android
        run: test -d "$ANDROID_HOME"
      - name: Installer Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Construire pages TEST
        working-directory: mobile
        run: npm run build:web
      - name: Generer Android
        working-directory: mobile
        run: npx cap add android
      - name: Ajouter permissions et logo
        working-directory: mobile
        run: node scripts/configure-native.cjs
      - name: Synchroniser projet Android
        working-directory: mobile
        run: npx cap sync android
      - name: Generer APK de test
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Installer et ouvrir SAMGO sur emulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh
      - name: Conserver capture de l'ecran d'accueil du simulateur
        uses: actions/upload-artifact@v4
        with:
          name: samgo-android-test-capture-ecran
          path: mobile/test-output/samgo-android-emulateur.png
          retention-days: 7
          if-no-files-found: error
