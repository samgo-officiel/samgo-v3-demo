name: SAMGO - Tester demarrage Android sur emulateur

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-test.yml'
      - 'scripts/android-emulator-smoke.sh'

permissions:
  contents: read
  actions: read

jobs:
  smoke-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Recuperer SAMGO
        uses: actions/checkout@v4
      - name: Recuperer APK Android TEST 0.1.2 deja compilee
        uses: actions/download-artifact@v4
        with:
          name: samgo-android-test-debug
          repository: samgo-officiel/samgo-v3-demo
          run-id: 40766097419
          github-token: ${{ github.token }}
          path: mobile/android/app/build/outputs/apk/debug
      - name: Verifier fichier Android natif
        run: test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Installer et ouvrir SAMGO sur emulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh
      - name: Conserver capture de l'ecran d'accueil du simulateur
        uses: actions/upload-artifact@v4
        with:
          name: samgo-android-test-capture-ecran
          path: mobile/test-output/samgo-android-emulateur.png
          retention-days: 7
          if-no-files-found: error
